<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="1200" height="1600" style="background:#fcfcfc;">
  <defs>
    <!-- Subtle parchment texture -->
    <pattern id="guilloche" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 0,20 Q 10,0 20,20 T 40,20" fill="none" stroke="#e8ece9" stroke-width="0.8" opacity="0.45" />
      <path d="M 20,0 Q 0,10 20,20 T 20,40" fill="none" stroke="#e5ebe6" stroke-width="0.8" opacity="0.45" />
    </pattern>
  </defs>

  <!-- Paper background with light border and guilloche pattern -->
  <rect width="1200" height="1600" fill="#fbfcfb" />
  <rect width="1200" height="1600" fill="url(#guilloche)" />
  <rect x="25" y="25" width="1150" height="1550" fill="none" stroke="#003e22" stroke-width="1.5" opacity="0.12" />

  <!-- Center Watermark: Pakistan Star & Crescent + SECP -->
  <g transform="translate(600, 750) scale(1.6)" opacity="0.08" text-anchor="middle">
    <circle cx="0" cy="-50" r="140" fill="none" stroke="#004d26" stroke-width="5" />
    <path d="M -30,-110 A 65,65 0 1,0 45,-15 A 50,50 0 1,1 -30,-110 Z" fill="#004d26" />
    <polygon points="15,-65 22,-45 42,-45 26,-32 32,-12 15,-24 -2,-12 4,-32 -12,-45 8,-45" fill="#004d26" />
    <text x="0" y="80" font-family="Liberation Sans, DejaVu Sans, sans-serif" font-size="78" font-weight="900" fill="#004d26" letter-spacing="18">SECP</text>
  </g>

  <!-- Top Header -->
  <text x="600" y="140" text-anchor="middle" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="33" font-weight="700" fill="#111827" letter-spacing="2.2">
    SECURITIES AND EXCHANGE COMMISSION OF PAKISTAN
  </text>
  <text x="600" y="195" text-anchor="middle" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="500" fill="#1f2937">
    Company Registration Office
  </text>

  <!-- Title: CERTIFICATE OF INCORPORATION -->
  <text x="600" y="295" text-anchor="middle" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="44" font-weight="900" fill="#000000" letter-spacing="1.5">
    CERTIFICATE OF INCORPORATION
  </text>

  <!-- Statute Reference -->
  <text x="600" y="375" text-anchor="middle" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="500" fill="#111827">
    [Under section 16 of the Companies Act, 2017 (XIX of 2017)]
  </text>

  <!-- Corporate Unique ID Number -->
  <text x="600" y="475" text-anchor="middle" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="600" fill="#111827">
    Corporate Unique Identification No. 886105
  </text>

  <!-- Certification Paragraph -->
  <g font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="30.5" fill="#111827" text-anchor="middle">
    <!-- Line 1 -->
    <text x="600" y="565">
      <tspan font-weight="400">I hereby certify that </tspan>
      <tspan font-weight="800" text-decoration="underline">NBV TRADING (SMC-PRIVATE) LIMITED</tspan>
      <tspan font-weight="400"> is this</tspan>
    </text>

    <!-- Line 2 -->
    <text x="600" y="635" font-weight="400">
      day incorporated under the Companies Act, 2017 (XIX of 2017) and that
    </text>

    <!-- Line 3 -->
    <text x="600" y="705">
      <tspan font-weight="400">the company is </tspan>
      <tspan font-weight="800" text-decoration="underline">limited by shares.</tspan>
    </text>

    <!-- Given at Islamabad date -->
    <text x="600" y="805">
      <tspan font-weight="400">Given at </tspan>
      <tspan font-weight="800" text-decoration="underline">ISLAMABAD</tspan>
      <tspan font-weight="400"> on the </tspan>
      <tspan font-weight="800" text-decoration="underline">30th</tspan>
      <tspan font-weight="400"> day of </tspan>
      <tspan font-weight="800" text-decoration="underline">OCTOBER Two Thousand</tspan>
      <tspan font-weight="400"> and</tspan>
    </text>

    <!-- Line 5 -->
    <text x="600" y="870">
      <tspan font-weight="800" text-decoration="underline">Twenty-Six</tspan>
    </text>
  </g>

  <!-- Big Watermark "SECP" across lower center -->
  <text x="600" y="1040" text-anchor="middle" font-family="Liberation Sans, DejaVu Sans, sans-serif" font-size="62" font-weight="800" fill="#004d26" opacity="0.12" letter-spacing="16">
    S E C P
  </text>

  <!-- Official Seal of Registrar of Companies (Bottom-Left) -->
  <g transform="translate(230, 1310)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="105" fill="#f8faf9" stroke="#007a4d" stroke-width="3" />
    <circle cx="0" cy="0" r="100" fill="none" stroke="#005a36" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- Circular Seal Text -->
    <path id="sealPath" d="M -86,0 A 86,86 0 1,1 86,0 A 86,86 0 1,1 -86,0" fill="none" />
    <text font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="800" fill="#005a36" letter-spacing="2.2">
      <textPath href="#sealPath" startOffset="50%" text-anchor="middle">
        • SEAL OF REGISTRAR OF COMPANIES •
      </textPath>
    </text>

    <!-- Inner emblem circle -->
    <circle cx="0" cy="0" r="68" fill="#005a36" />
    <circle cx="0" cy="0" r="64" fill="#007a4d" />
    <circle cx="0" cy="0" r="54" fill="#00472a" />

    <!-- Scales of justice and wheat wreath inside seal -->
    <g transform="scale(0.85) translate(0, -5)" stroke="#ffffff" fill="none" stroke-width="2.5" stroke-linecap="round">
      <line x1="0" y1="-28" x2="0" y2="18" stroke-width="3.5" />
      <line x1="-28" y1="-16" x2="28" y2="-16" stroke-width="3" />
      <!-- Left pan -->
      <line x1="-28" y1="-16" x2="-38" y2="2" />
      <line x1="-28" y1="-16" x2="-18" y2="2" />
      <path d="M -42,2 Q -28,12 -14,2 Z" fill="#ffffff" stroke="none" />
      <!-- Right pan -->
      <line x1="28" y1="-16" x2="18" y2="2" />
      <line x1="28" y1="-16" x2="38" y2="2" />
      <path d="M 14,2 Q 28,12 42,2 Z" fill="#ffffff" stroke="none" />
      <!-- Base pedestal -->
      <path d="M -16,18 L 16,18" stroke-width="4" />
      <!-- Star & Crescent above -->
      <path d="M -6,-36 A 8,8 0 1,0 6,-24 A 6,6 0 1,1 -6,-36 Z" fill="#ffffff" stroke="none" />
      <polygon points="2,-32 4,-28 8,-28 5,-25 6,-21 2,-23 -2,-21 -1,-25 -4,-28 0,-28" fill="#ffffff" stroke="none" />
    </g>
    <!-- SECP in seal bottom -->
    <text x="0" y="85" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="900" fill="#005a36" letter-spacing="3">SECP</text>
  </g>

  <!-- Signature & Assistant Registrar Details (Bottom-Right) -->
  <g transform="translate(930, 1140)">
    <!-- Fluent Official Cursive Ink Signature -->
    <path d="M 15,10 C 12,-35 -15,-65 -35,-85 C -42,-92 -50,-80 -45,-60 C -38,-30 -10,35 15,55 C 28,65 52,60 40,25 C 25,-10 -5,-35 -20,-30 C -32,-25 -10,15 15,30 C 35,42 65,30 85,15 C 92,10 75,-5 60,0 C 45,5 25,25 35,40 C 45,55 75,50 90,35" 
          fill="none" stroke="#000000" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M -20,-40 L 45,45 M 0,-20 L 75,-25" fill="none" stroke="#000000" stroke-width="2.4" stroke-linecap="round" />

    <!-- Assistant Registrar Text -->
    <text x="35" y="115" text-anchor="middle" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" fill="#111827">
      Muhammad Shoaib Khan
    </text>
    <text x="35" y="155" text-anchor="middle" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="500" fill="#1f2937">
      Assistant Registrar
    </text>

    <!-- QR Code Block on Bottom-Right -->
    <g transform="translate(-40, 180)">
      <rect x="0" y="0" width="150" height="150" fill="#ffffff" stroke="#000000" stroke-width="2.5" />
      
      <!-- Top-Left Corner Finder Pattern -->
      <rect x="10" y="10" width="42" height="42" fill="#000000" />
      <rect x="17" y="17" width="28" height="28" fill="#ffffff" />
      <rect x="24" y="24" width="14" height="14" fill="#000000" />

      <!-- Top-Right Corner Finder Pattern -->
      <rect x="98" y="10" width="42" height="42" fill="#000000" />
      <rect x="105" y="17" width="28" height="28" fill="#ffffff" />
      <rect x="112" y="24" width="14" height="14" fill="#000000" />

      <!-- Bottom-Left Corner Finder Pattern -->
      <rect x="10" y="98" width="42" height="42" fill="#000000" />
      <rect x="17" y="105" width="28" height="28" fill="#ffffff" />
      <rect x="24" y="112" width="14" height="14" fill="#000000" />

      <!-- QR Data modules -->
      <rect x="60" y="15" width="8" height="8" fill="#000000" />
      <rect x="75" y="15" width="14" height="8" fill="#000000" />
      <rect x="65" y="30" width="12" height="12" fill="#000000" />
      <rect x="82" y="30" width="8" height="8" fill="#000000" />
      <rect x="60" y="50" width="30" height="8" fill="#000000" />
      
      <rect x="15" y="60" width="8" height="24" fill="#000000" />
      <rect x="30" y="65" width="18" height="8" fill="#000000" />
      <rect x="105" y="60" width="12" height="20" fill="#000000" />
      <rect x="125" y="65" width="8" height="14" fill="#000000" />

      <rect x="60" y="70" width="12" height="12" fill="#000000" />
      <rect x="80" y="75" width="10" height="20" fill="#000000" />
      <rect x="60" y="95" width="15" height="10" fill="#000000" />
      <rect x="85" y="105" width="15" height="15" fill="#000000" />
      <rect x="60" y="120" width="24" height="10" fill="#000000" />
      <rect x="105" y="95" width="12" height="12" fill="#000000" />
      <rect x="125" y="105" width="10" height="25" fill="#000000" />
      <rect x="105" y="125" width="14" height="10" fill="#000000" />
    </g>
  </g>

  <!-- Bottom Verification URL -->
  <text x="635" y="1530" text-anchor="middle" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="500" fill="#111827">
    https://eservices.secp.gov.pk/eServices/ControllerServlet?
  </text>
  <text x="635" y="1560" text-anchor="middle" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="500" fill="#111827">
    equest_id=VERIFY_ONLINE_INCORP_CERT&amp;id= 886105
  </text>
</svg>